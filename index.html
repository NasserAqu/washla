    function addrForm(a, mode) {
      return `<div class="field"><span>${t('addrLabel')}</span><div class="tags">
          ${['home', 'work', 'other'].map(l => `<button type="button" class="tag" aria-pressed="${a.label === l}" data-albl="${l}" data-amode="${mode}">${ic(l === 'work' ? 'i-work' : 'i-home', 'sm')}${t('lbl_' + l)}</button>`).join('')}</div></div>
        <label class="field"><span>${t('addrDetails')}</span>
          <textarea class="input ${S.errs.addr ? 'bad' : ''}" id="addrText-${mode}" rows="2" placeholder="${t('addrPh')}">${esc(a.text)}</textarea></label>
        ${S.errs.addr ? `<div class="err" style="margin-top:6px">${t('errAddr')}</div>` : ''}
        <button type="button" class="link-btn" style="margin-top:6px" data-locate="${mode}">${ic('i-locate', 'sm')} ${t('locateMe')}</button>`;
    }

    /* ============ Router ============ */
    const history_ = [];
    function go(view, params = {}, push = true) {
      if (push && S.view !== view) history_.push({ view:S.view, params:S.params });
      if (view === 'checkout' && !totals().count) view = 'shop';
      S.view = view; S.params = params;
      if (view !== 'checkout') S.pickSlot = false;
      render();
      window.scrollTo({ top:0 });
    }
    function back() {
      const prev = history_.pop();
      captureInputs();
      if (prev && prev.view !== 'done') go(prev.view, prev.params, false); else go('home', {}, false);
    }
    function render() {
      document.documentElement.lang = S.lang;
      document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
      document.title = S.lang === 'ar' ? 'غسله Wash' : 'Washla';
      renderTop();
      $('#view').innerHTML = views[S.view]();
      renderChrome();
    }
    function captureInputs() {
      if (typeof captureCard === 'function') captureCard();
      if ($('#notes')) S.notes = $('#notes').value;
      if ($('#promo')) S.promoIn = $('#promo').value;
      if ($('#addrText-draft')) S.draftAddr.text = $('#addrText-draft').value;
    }

    /* ============ Sheet ============ */
    function openSheet(html, label) {
      $('#sheetIn').innerHTML = html; $('#sheet').setAttribute('aria-label', label || '');
      $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); document.body.classList.add('lock');
      setTimeout(() => $('#sheet input, #sheet textarea')?.focus({ preventScroll:true }), 120);
    }
    function closeSheet() {
      $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.classList.remove('lock');
      S.errs = {};
    }

    /* login flow (simulated SMS) */
    const L = { phone:'', code:'', step:'phone', err:false };
    function loginSheet() {
      if (L.step === 'phone') return openSheet(`
        <h2>${t('loginTitle')}</h2><p class="lead">${t('loginLead')}</p>
        <label class="field" style="margin-top:0"><span>${t('phone')}</span>
          <span class="phone-in"><span>+966</span><input id="phoneIn" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="${t('phonePh')}" value="${esc(L.phone.replace(/^0/, ''))}" maxlength="12" /></span></label>
        ${L.err ? `<div class="err" style="margin-top:6px">${t('errPhone')}</div>` : ''}
        <div class="stack"><button type="button" class="btn full" data-sendcode>${t('sendCode')}</button></div>`, t('loginTitle'));
      if (L.step === 'code') return openSheet(`
        <h2>${t('codeTitle')}</h2><p class="lead">${t('codeLead')} <b class="num" style="direction:ltr;display:inline-block">${fmtPhone(L.phone)}</b></p>
        <div class="otp">${[0,1,2,3].map(i => `<input id="otp${i}" inputmode="numeric" maxlength="1" aria-label="${i + 1}" autocomplete="${i ? 'off' : 'one-time-code'}" />`).join('')}</div>
        ${L.err ? `<div class="err" style="text-align:center">${t('errCode')}</div>` : ''}
        <div class="demo-code">${t('demoCode')} <b>${L.code}</b></div>
        <div class="stack"><button type="button" class="btn full" data-verify>${t('verify')}</button>
          <button type="button" class="btn line full" data-editphone>${t('editPhone')}</button></div>`, t('codeTitle'));
      return openSheet(`
        <h2>${t('nameTitle')}</h2><p class="lead">${t('nameLead')}</p>
        <input class="input ${L.err ? 'bad' : ''}" id="nameIn" autocomplete="name" placeholder="${t('namePh')}" />
        ${L.err ? `<div class="err" style="margin-top:6px">${t('errName')}</div>` : ''}
        <div class="stack"><button type="button" class="btn full" data-savename>${t('save')}</button></div>`, t('nameTitle'));
    }
    function startLogin(then) { S.pending = then || null; Object.assign(L, { phone:'', code:'', step:'phone', err:false }); loginSheet(); }
    function finishLogin() {
      store.set(K.session, S.phone);
      closeSheet();
      toast(t('welcome', { name:me().name.split(' ')[0] }), 'i-user');
      const p = S.pending; S.pending = null;
      render();
      if (p) p();
    }

    /* address sheet */
    const A = { label:'home', text:'' };
    function addrSheet() {
      openSheet(`<h2>${t('newAddress')}</h2>${addrForm(A, 'sheet')}
        <div class="stack"><button type="button" class="btn full" data-saveaddr>${t('saveAddr')}</button></div>`, t('newAddress'));
    }
    function addAddress(a) {
      const u = me(); const list = u.addresses || [];
      const rec = { id:'a' + Date.now().toString(36), label:a.label, text:a.text.trim(), def: !list.length };
      u.addresses = [...list, rec]; saveMe(u); return rec;
    }

    /* ============ Payments (simulated gateway) ============ */
    const TEST_DECLINE = '4000000000000002';
    const digits = v => String(v || '').replace(/\D/g, '');
    function brandOf(n) {
      n = digits(n);
      if (/^4/.test(n)) return 'visa';
      if (/^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(n)) return 'mc';
      return n.length >= 1 ? 'card' : '';
    }
    const brandName = b => ({ visa:'Visa', mc:'Mastercard', mada:'mada' }[b] || (S.lang === 'ar' ? 'بطاقة' : 'Card'));
    function luhn(n) {
      let sum = 0, alt = false;
      for (let i = n.length - 1; i >= 0; i--) { let x = +n[i]; if (alt) { x *= 2; if (x > 9) x -= 9; } sum += x; alt = !alt; }
      return n.length >= 13 && sum % 10 === 0;
    }
    function expOk(v) {
      const m = /^(\d{2})\s*\/\s*(\d{2})$/.exec(v || ''); if (!m) return false;
      const mo = +m[1], yr = 2000 + +m[2]; if (mo < 1 || mo > 12) return false;
      const end = new Date(yr, mo, 1); return end > new Date();
    }
    const fmtCard = v => digits(v).slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
    const fmtExp = v => { const x = digits(v).slice(0, 4); return x.length > 2 ? `${x.slice(0, 2)}/${x.slice(2)}` : x; };
    const newTxn = () => 'TX' + Date.now().toString().slice(-6) + Math.floor(100000 + Math.random() * 900000);

    function payBlock(u) {
      const cards = u?.cards || [];
      if (S.cardSel !== 'new' && !cards.some(c => c.id === S.cardSel)) S.cardSel = cards[0]?.id || 'new';
      const e = S.errs, c = S.card, br = brandOf(c.num);
      const logo = { visa:'<span class="logo visa">VISA</span>', mc:'<span class="logo mc">MC</span>' }[br] || '';
      const methods = [
        ['card', `<span class="logos"><span class="logo mada">mada</span><span class="logo visa">VISA</span><span class="logo mc">MC</span></span>`],
        ['applepay', `<span class="logos"><span class="logo apple">Apple Pay</span></span>`],
        ['stcpay', `<span class="logos"><span class="logo stc">stc pay</span></span>`]
      ];
      const cardForm = S.pay !== 'card' ? '' : `<div class="cardbox">
          ${cards.length ? `<div class="opts" style="margin:0">${cards.map(k => `
            <label class="pm"><input type="radio" name="cardSel" value="${k.id}" ${S.cardSel === k.id ? 'checked' : ''} />
              <span class="tx"><b dir="ltr" style="text-align:start">${brandName(k.brand)} •••• ${k.last4}</b><small>${t('expShort')} <span dir="ltr">${k.exp}</span></small></span></label>`).join('')}
            <label class="pm"><input type="radio" name="cardSel" value="new" ${S.cardSel === 'new' ? 'checked' : ''} /><span class="tx"><b>${t('newCard')}</b></span>${ic('i-plus', 'sm')}</label></div>` : ''}
          ${S.cardSel !== 'new' ? `
            <label class="field" style="margin:0"><span>${t('savedCvv')}</span><input class="input ${e.cvv ? 'bad' : ''}" id="sCvv" inputmode="numeric" autocomplete="cc-csc" maxlength="3" placeholder="•••" value="${esc(S.savedCvv)}" style="max-width:140px" /></label>
            ${e.cvv ? `<div class="err" id="err-cvv">${t('errCardCvv')}</div>` : ''}` : `
            <label class="field" style="margin:0"><span>${t('cardNum')}</span><span class="numwrap"><input class="input ${e.num ? 'bad' : ''}" id="cNum" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" value="${esc(fmtCard(c.num))}" />${logo}</span></label>
            ${e.num ? `<div class="err" id="err-num">${t('errCardNum')}</div>` : ''}
            <div class="two">
              <label class="field" style="margin:0"><span>${t('cardExp')}</span><input class="input ${e.exp ? 'bad' : ''}" id="cExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" value="${esc(c.exp)}" /></label>
              <label class="field" style="margin:0"><span>${t('cardCvv')}</span><input class="input ${e.cvv ? 'bad' : ''}" id="cCvv" inputmode="numeric" autocomplete="cc-csc" maxlength="3" placeholder="•••" value="${esc(c.cvv)}" /></label>
            </div>
            ${e.exp ? `<div class="err" id="err-exp">${t('errCardExp')}</div>` : ''}${e.cvv ? `<div class="err" id="err-cvv">${t('errCardCvv')}</div>` : ''}
            <label class="field" style="margin:0"><span>${t('cardName')}</span><input class="input ${e.name ? 'bad' : ''}" id="cName" autocomplete="cc-name" placeholder="${t('cardNamePh')}" value="${esc(c.name)}" /></label>
            ${e.name ? `<div class="err" id="err-name">${t('errCardName')}</div>` : ''}
            <label class="check"><input type="checkbox" id="cSave" ${c.save ? 'checked' : ''} />${t('saveCard')}</label>
            <div class="testcards">${t('testCards')} <code>4111 1111 1111 1111</code> ${t('testOk')} · <code>4000 0000 0000 0002</code> ${t('testNo')}</div>`}
        </div>`;
      return `<div class="opts">${methods.map(([m, logos]) => `
          <label class="pm"><input type="radio" name="pay" value="${m}" ${S.pay === m ? 'checked' : ''} />
            <span class="tx"><b>${t('pay_' + m)}</b><small>${t('pay_' + m + '_s')}</small></span>${logos}</label>
          ${m === 'card' ? cardForm : ''}`).join('')}</div>
        ${S.payErr ? `<div class="pay-err">${ic('i-x', 'sm')}<span>${t(S.payErr)}</span></div>` : ''}
        <div class="secure">${ic('i-shield', 'sm')}${t('secure')}</div>`;
    }

    function captureCard() {
      if ($('#cNum')) S.card.num = digits($('#cNum').value);
      if ($('#cExp')) S.card.exp = $('#cExp').value.trim();
      if ($('#cCvv')) S.card.cvv = digits($('#cCvv').value);
      if ($('#cName')) S.card.name = $('#cName').value;
      if ($('#cSave')) S.card.save = $('#cSave').checked;
      if ($('#sCvv')) S.savedCvv = digits($('#sCvv').value);
    }
    function validatePayment() {
      if (S.pay !== 'card') return true;
      const e = {};
      if (S.cardSel !== 'new') { if (!/^\d{3}$/.test(S.savedCvv)) e.cvv = true; }
      else {
        if (!luhn(S.card.num) || !['visa', 'mc'].includes(brandOf(S.card.num))) e.num = true;
        if (!expOk(S.card.exp)) e.exp = true;
        if (!/^\d{3}$/.test(S.card.cvv)) e.cvv = true;
        if (!S.card.name.trim()) e.name = true;
      }
      Object.assign(S.errs, e);
      return !Object.keys(e).length;
    }

    const P = { code:'', err:false, phone:'', step:'' };
    const sixDigits = () => String(Math.floor(100000 + Math.random() * 900000));
    function payInfo() {
      const u = me();
      if (S.cardSel !== 'new') { const k = u.cards.find(c => c.id === S.cardSel); return { brand:k.brand, last4:k.last4, number:null }; }
      return { brand:brandOf(S.card.num), last4:S.card.num.slice(-4), number:S.card.num };
    }
    function startPayment(order) {
      P.err = false;
      if (S.pay === 'card') { P.code = sixDigits(); return tdsSheet(order); }
      if (S.pay === 'applepay') return applePaySheet(order);
      P.step = 'phone'; P.phone = S.phone; return stcSheet(order);
    }
    function tdsSheet(order) {
      const pi = payInfo();
      openSheet(`<div class="bank">
          <div class="bank-head"><b>${ic('i-shield')}${t('tdsTitle')}</b><span class="logo ${pi.brand}">${pi.brand === 'mc' ? 'MC' : 'VISA'}</span></div>
          <div class="kv"><span>${t('merchant')}</span><span>Washla غسله</span></div>
          <div class="kv"><span>${t('amount')}</span><b class="num">${money(order.total)}</b></div>
          <div class="kv"><span>${t('card')}</span><span dir="ltr">•••• ${pi.last4}</span></div>
          <p style="margin:12px 0 0;font-size:.88rem;color:var(--ink-2)">${t('tdsLead')}</p>
          <input class="code-in ${P.err ? 'bad' : ''}" id="tdsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" />
          ${P.err ? `<div class="err" style="text-align:center;margin-top:6px">${t('errOtp')}</div>` : ''}
          <div class="demo-code">${t('demoOtp')} <b>${P.code}</b></div>
        </div>
        <div class="stack"><button type="button" class="btn full" data-tds-ok>${t('confirmPay')}</button><button type="button" class="btn line full" data-pay-cancel>${t('cancelPay')}</button></div>`, t('tdsTitle'));
      S.payOrder = order;
    }
    function applePaySheet(order) {
      openSheet(`<div class="apsheet">
          <div class="ap-top"><b style="font-size:1.1rem">Apple Pay</b><button type="button" class="link-btn" style="color:#0a84ff" data-pay-cancel>${t('cancelPay')}</button></div>
          <div class="ap-row"><span>${t('apCard')}</span><span>${t('apCardVal')}</span></div>
          <div class="ap-row"><span>${t('apPayTo')}</span><span>WASHLA</span></div>
          <div class="ap-row" style="font-weight:600"><span>${t('total')}</span><span class="num">${money(order.total)}</span></div>
          <div class="faceid">${ic('i-user')}${t('apConfirm')}</div>
        </div>
        <div class="stack"><button type="button" class="btn full apple" data-ap-ok>${t('apConfirm')}</button></div>
        <p class="terms">${t('apNote')}</p>`, t('apTitle'));
      S.payOrder = order;
    }
    function stcSheet(order) {
      S.payOrder = order;
      if (P.step === 'phone') return openSheet(`<h2>${t('stcTitle')}</h2><p class="lead">${t('stcLead')}</p>
          <span class="phone-in"><span>+966</span><input id="stcPhone" type="tel" inputmode="numeric" value="${esc((P.phone || '').replace(/^0/, ''))}" maxlength="12" /></span>
          ${P.err ? `<div class="err" style="margin-top:6px">${t('errStcPhone')}</div>` : ''}
          <div class="kv" style="margin-top:12px"><span>${t('amount')}</span><b class="num">${money(order.total)}</b></div>
          <div class="stack"><button type="button" class="btn full stc" data-stc-send>${t('stcSend')}</button><button type="button" class="btn line full" data-pay-cancel>${t('cancelPay')}</button></div>`, t('stcTitle'));
      openSheet(`<h2>${t('stcTitle')}</h2><p class="lead">${t('stcCodeLead')} <b dir="ltr" style="display:inline-block">${fmtPhone(P.phone)}</b></p>
          <input class="code-in ${P.err ? 'bad' : ''}" id="stcCode" inputmode="numeric" maxlength="6" placeholder="••••••" />
          ${P.err ? `<div class="err" style="text-align:center;margin-top:6px">${t('errOtp')}</div>` : ''}
          <div class="demo-code">${t('demoOtp')} <b>${P.code}</b></div>
          <div class="stack"><button type="button" class="btn full stc" data-stc-ok>${t('confirmPay')} · ${money(order.total)}</button><button type="button" class="btn line full" data-pay-cancel>${t('cancelPay')}</button></div>`, t('stcTitle'));
    }
    function processPayment(order, declined) {
      openSheet(`<div style="text-align:center;padding-bottom:20px"><div class="spin"></div><b style="display:block;font-size:1.05rem">${t('processing')}</b><span style="color:var(--muted);font-size:.85rem">${t('processingSub')}</span></div>`, t('processing'));
      setTimeout(() => {
        closeSheet();
        if (declined) { S.payErr = 'declined'; render(); document.querySelector('.pay-err')?.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
        const payment = { method:S.pay, txn:newTxn(), at:Date.now(), status:'paid' };
        if (S.pay === 'card') {
          const pi = payInfo(); payment.brand = pi.brand; payment.last4 = pi.last4;
          if (pi.number && S.card.save) {
            const u = me(); u.cards = u.cards || [];
            if (!u.cards.some(c => c.last4 === pi.last4 && c.exp === S.card.exp)) u.cards.push({ id:'c' + Date.now().toString(36), brand:pi.brand, last4:pi.last4, exp:S.card.exp });
            saveMe(u);
          }
        }
        finishOrder(order, payment);
      }, 1400);
    }

    /* place order */
    function place() {
      captureInputs(); captureCard();
      S.payErr = null; S.errs = {};
      const u = me();
      if (!u) { startLogin(() => { if (S.view === 'checkout') place(); }); return; }
      let addr = (u.addresses || []).find(a => a.id === S.addrId);
      if (!addr) {
        if (!S.draftAddr.text.trim()) { S.errs.addr = true; render(); $('#addrText-draft')?.focus(); return; }
        addr = addAddress(S.draftAddr); S.addrId = addr.id; S.draftAddr = { label:'home', text:'' };
      }
      if (!S.slot || new Date(S.slot).getTime() < minTime()) { S.slot = null; render(); toast(t('noSlots'), 'i-clock'); return; }
      if (!validatePayment()) { render(); document.querySelector('.cardbox .err')?.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
      const tot = totals();
      const o = {
        id: String(Date.now()).slice(-6), shopId:S.shopId, slot:S.slot, address:`${t('lbl_' + addr.label)} — ${addr.text}`,
        lines: tot.list.map(e => ({ svc:e.svc, item:e.item.id, q:e.q })), count:tot.count, sub:tot.sub, disc:tot.disc, fee:tot.fee, total:tot.total,
        notes:S.notes, createdAt:Date.now(), step:0, status:'active'
      };
      startPayment(o);
    }
    function finishOrder(o, payment) {
      o.payment = payment;
      saveOrders([...myOrders(), o]);
      S.lastOrder = o.id;
      S.cart = {}; S.promoOn = false; S.promoIn = ''; S.promoErr = false; S.notes = ''; S.slot = null; S.errs = {}; S.savedCvv = ''; S.card = { num:'', exp:'', cvv:'', name:'', save:true }; S.payErr = null;
      history_.length = 0;
      go('done', {}, false);
    }

    function locateInto(mode) {
      const set = txt => {
        if (mode === 'sheet') { A.text = txt; addrSheet(); }
        else { S.draftAddr.text = txt; render(); }
      };
      if (mode === 'sheet') A.text = $('#addrText-sheet')?.value || A.text; else captureInputs();
      if (!navigator.geolocation) { toast(t('locFail'), 'i-pin'); return; }
      toast(t('locating'), 'i-locate');
      navigator.geolocation.getCurrentPosition(
        p => set(`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`),
        () => toast(t('locFail'), 'i-pin'), { timeout:8000 });
    }

    /* ============ Events ============ */
    document.addEventListener('click', e => {
      const b = e.target.closest('button, a'); if (!b) return;
      const d = b.dataset;
      if (b.tagName === 'A') return;                       // real links (WhatsApp, Maps) open normally

      if (d.go) return go(d.go);
      if ('back' in d) return back();
      if ('lang' in d) { S.lang = S.lang === 'ar' ? 'en' : 'ar'; store.set(K.lang, S.lang); captureInputs(); render(); if ($('#sheet').classList.contains('on')) closeSheet(); return; }
      if (d.svc) { S.service = d.svc; render(); return; }
      if (d.sort) { S.sort = d.sort; render(); return; }
      if ('open' in d) { S.openOnly = !S.openOnly; render(); return; }
      if ('clear' in d) { S.q = ''; S.openOnly = false; render(); return; }
      if (d.shop) {
        if (S.shopId !== d.shop) { S.cart = {}; S.promoOn = false; }
        S.shopId = d.shop; S.tab = S.service; return go('shop');
      }
      if (d.tab) { S.tab = d.tab; render(); return; }
      if (d.q) {
        const n = Math.max(0, Math.min(99, (S.cart[d.q] || 0) + Number(d.d)));
        if (n) S.cart[d.q] = n; else delete S.cart[d.q];
        render(); return;
      }
      if ('pickslot' in d) { captureInputs(); S.pickSlot = !S.pickSlot; render(); return; }
      if (d.day) { captureInputs(); S.dayIdx = Number(d.day); render(); return; }
      if (d.slot) { captureInputs(); S.slot = d.slot; render(); return; }
      if (d.albl) {
        if (d.amode === 'sheet') { A.text = $('#addrText-sheet').value; A.label = d.albl; addrSheet(); }
        else { captureInputs(); S.draftAddr.label = d.albl; render(); }
        return;
      }
      if (d.locate) return locateInto(d.locate);
      if ('addaddr' in d) { captureInputs(); A.label = 'home'; A.text = ''; S.errs = {}; return addrSheet(); }
      if ('saveaddr' in d) {
        A.text = $('#addrText-sheet').value;
        if (!A.text.trim()) { S.errs.addr = true; return addrSheet(); }
        const rec = addAddress(A); S.addrId = rec.id; S.errs = {}; closeSheet(); render(); return;
      }
      if (d.defaddr) { const u = me(); u.addresses.forEach(a => { a.def = a.id === d.defaddr; }); saveMe(u); render(); return; }
      if (d.deladdr) {
        const u = me(); u.addresses = u.addresses.filter(a => a.id !== d.deladdr);
        if (u.addresses.length && !u.addresses.some(a => a.def)) u.addresses[0].def = true;
        saveMe(u); render(); return;
      }
      if ('promo' in d) {
        captureInputs();
        if (S.promoIn.trim().toUpperCase() === PROMO.code) { S.promoOn = true; S.promoErr = false; toast(t('promoOk'), 'i-tag'); }
        else S.promoErr = true;
        render(); return;
      }
      if ('unpromo' in d) { captureInputs(); S.promoOn = false; S.promoIn = ''; render(); return; }
      if ('place' in d) return place();
      if ('payCancel' in d) { closeSheet(); toast(t('payCancelled'), 'i-x'); return; }
      if ('tdsOk' in d) {
        const code = digits($('#tdsCode').value);
        if (code !== P.code) { P.err = true; return tdsSheet(S.payOrder); }
        const pi = payInfo();
        return processPayment(S.payOrder, pi.number === TEST_DECLINE);
      }
      if ('apOk' in d) return processPayment(S.payOrder, false);
      if ('stcSend' in d) {
        let raw = digits($('#stcPhone').value).replace(/^(00966|966)/, '').replace(/^0/, '');
        if (!/^5\d{8}$/.test(raw)) { P.err = true; return stcSheet(S.payOrder); }
        P.phone = '0' + raw; P.err = false; P.step = 'code'; P.code = sixDigits(); return stcSheet(S.payOrder);
      }
      if ('stcOk' in d) {
        if (digits($('#stcCode').value) !== P.code) { P.err = true; return stcSheet(S.payOrder); }
        return processPayment(S.payOrder, false);
      }
      if (d.cancel) { S.confirmCancel = d.cancel; render(); return; }
      if ('cancelNo' in d) { S.confirmCancel = null; render(); return; }
      if (d.cancelYes) {
        const list = myOrders(), o = list.find(x => x.id === d.cancelYes);
        if (o && (o.step || 0) === 0) { o.status = 'cancelled'; o.payment.status = 'refunded'; o.payment.refundedAt = Date.now(); saveOrders(list); toast(t('orderCancelled'), 'i-check'); }
        S.confirmCancel = null; render(); return;
      }
      if (d.delcard) { const u = me(); u.cards = (u.cards || []).filter(c => c.id !== d.delcard); saveMe(u); toast(t('cardRemoved'), 'i-trash'); render(); return; }
      if (d.openOrder) { history_.length = 0; history_.push({ view:'orders', params:{} }); return go('order', { id:d.openOrder }, false); }
      if (d.step) { const list = myOrders(); const o = list.find(x => x.id === d.step); if (o.status !== 'cancelled') o.step = Math.min(4, (o.step || 0) + 1); S.confirmCancel = null; saveOrders(list); render(); return; }
      if (d.reorder) {
        const o = myOrders().find(x => x.id === d.reorder);
        S.shopId = o.shopId; S.cart = {}; o.lines.forEach(l => { S.cart[`${l.svc}|${l.item}`] = l.q; }); S.tab = o.lines[0].svc;
        history_.length = 0; return go('shop', {}, false);
      }
      if ('login' in d) return startLogin();
      if ('logout' in d) { store.del(K.session); S.phone = null; S.addrId = null; toast(t('loggedOut'), 'i-logout'); render(); return; }

      /* login sheet */
      if ('sendcode' in d) {
        let raw = ($('#phoneIn').value || '').replace(/[^\d]/g, '');
        raw = raw.replace(/^(00966|966)/, '').replace(/^0/, '');
        const ok = /^5\d{8}$/.test(raw);
        L.phone = ok ? '0' + raw : $('#phoneIn').value; L.err = !ok;
        if (ok) { L.code = String(Math.floor(1000 + Math.random() * 9000)); L.step = 'code'; }
        return loginSheet();
      }
      if ('editphone' in d) { L.step = 'phone'; L.err = false; return loginSheet(); }
      if ('verify' in d) {
        const code = [0,1,2,3].map(i => $('#otp' + i).value).join('');
        if (code !== L.code) { L.err = true; return loginSheet(); }
        S.phone = L.phone; L.err = false;
        if (me()) return finishLogin();
        L.step = 'name'; return loginSheet();
      }
      if ('savename' in d) {
        const name = $('#nameIn').value.trim();
        if (!name) { L.err = true; return loginSheet(); }
        saveMe({ name, addresses: [] }); return finishLogin();
      }
    });


    document.addEventListener('change', e => {
      if (e.target.name === 'pay') { captureInputs(); captureCard(); S.pay = e.target.value; S.payErr = null; S.errs = {}; render(); }
      if (e.target.name === 'cardSel') { captureInputs(); captureCard(); S.cardSel = e.target.value; S.errs = {}; render(); }
      if (e.target.id === 'cSave') S.card.save = e.target.checked;
      if (e.target.name === 'addr') S.addrId = e.target.value;
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.id && el.id.startsWith('addrText') && S.errs.addr && el.value.trim()) {
        S.errs.addr = false; el.classList.remove('bad'); el.closest('.field').nextElementSibling?.classList.contains('err') && el.closest('.field').nextElementSibling.remove();
      }
      if (el.id === 'cNum') {
        const before = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
        el.value = fmtCard(el.value); S.card.num = digits(el.value);
        let pos = 0, seen = 0; while (pos < el.value.length && seen < before) { if (/\d/.test(el.value[pos])) seen++; pos++; }
        el.setSelectionRange(pos, pos);
        const br = brandOf(el.value), wrap = el.parentElement, old = wrap.querySelector('.logo');
        const html = { visa:'<span class="logo visa">VISA</span>', mc:'<span class="logo mc">MC</span>' }[br] || '';
        if (old) old.remove(); if (html) wrap.insertAdjacentHTML('beforeend', html);
      }
      if (el.id === 'cExp') { el.value = fmtExp(el.value); }
      const errKey = { cNum:'num', cExp:'exp', cCvv:'cvv', sCvv:'cvv', cName:'name' }[el.id];
      if (errKey && S.errs[errKey]) { S.errs[errKey] = false; el.classList.remove('bad'); $('#err-' + errKey)?.remove(); }
      if (el.id === 'cCvv' || el.id === 'sCvv' || el.id === 'tdsCode' || el.id === 'stcCode') { el.value = digits(el.value); }
      if (el.id === 'q') {
        S.q = el.value;
        const pos = el.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos);
      }
      if (el.id && el.id.startsWith('otp')) {
        el.value = el.value.replace(/\D/g, '').slice(-1);
        const i = Number(el.id.slice(3));
        if (el.value && i < 3) $('#otp' + (i + 1)).focus();
        if (i === 3 && el.value) $('[data-verify]')?.click();
      }
    });
    document.addEventListener('paste', e => {
      if (!e.target.id?.startsWith('otp')) return;
      const digits = (e.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (digits.length === 4) { e.preventDefault(); digits.split('').forEach((c, i) => { $('#otp' + i).value = c; }); $('[data-verify]')?.click(); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
      if (e.key === 'Backspace' && e.target.id?.startsWith('otp') && !e.target.value) { const i = Number(e.target.id.slice(3)); if (i) $('#otp' + (i - 1)).focus(); }
      if (e.key === 'Enter') {
        const map = { phoneIn:'[data-sendcode]', nameIn:'[data-savename]', promo:'[data-promo]', tdsCode:'[data-tds-ok]', stcPhone:'[data-stc-send]', stcCode:'[data-stc-ok]' };
        if (map[e.target.id]) { e.preventDefault(); $(map[e.target.id])?.click(); }
      }
    });
    $('#scrim').addEventListener('click', closeSheet);

    /* item names live in the dictionaries */
    Object.assign(T.ar, { item_thobe:'ثوب', item_shemagh:'شماغ / غترة', item_shirt:'قميص', item_tshirt:'تيشيرت', item_pants:'بنطلون', item_abaya:'عباية', item_suit:'بدلة', item_blanket:'بطانية', item_duvet:'لحاف', item_carpet:'سجادة', item_curtain:'ستارة' });
    Object.assign(T.en, { item_thobe:'Thobe', item_shemagh:'Shemagh / Ghutra', item_shirt:'Shirt', item_tshirt:'T-shirt', item_pants:'Trousers', item_abaya:'Abaya', item_suit:'Suit', item_blanket:'Blanket', item_duvet:'Duvet', item_carpet:'Rug', item_curtain:'Curtain' });

    if (S.phone && !me()) { S.phone = null; store.del(K.session); }
    render();
  })();
  </script>
</body>
</html>
