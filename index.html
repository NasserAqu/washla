<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f3" />
  <meta name="description" content="غسله — مغاسل الملابس القريبة منك في جنوب وغرب الرياض. كل القطع بريال واحد، استلام وتوصيل لباب بيتك." />
  <title>غسله Wash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" />
  <style>
    /* Layout: single phone-width column (wider on desktop), sticky header, bottom tab bar;
       ordering screens replace the tab bar with one sticky action bar. */
    :root {
      color-scheme: light;
      --bg:#fff8f3;            /* warm paper */
      --surface:#ffffff;
      --peach-50:#fff1e6;
      --peach-100:#ffe1cc;
      --peach-200:#fcc9a6;
      --orange:#f4985f;        /* soft orange, fills & highlights */
      --orange-strong:#e2733a; /* buttons */
      --orange-ink:#b4531d;    /* orange text on light */
      --ink:#2b1d14;
      --ink-2:#5c4a3e;
      --muted:#977f70;
      --line:#f0e2d6;
      --green:#2f9a68; --green-50:#e6f6ee;
      --red:#cf3d32;   --red-50:#fdecea;
      --star:#f2a516;
      --shadow:0 6px 24px rgba(120,60,20,.08);
      --shadow-lg:0 24px 60px rgba(70,30,5,.22);
      --r-xl:26px; --r-lg:20px; --r:14px; --r-sm:10px;
      --font:"Readex Pro", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      --nav-h:66px;
    }
    *, *::before, *::after { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.55 var(--font); -webkit-font-smoothing:antialiased; }
    body.lock { overflow:hidden; }
    button, input, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:3px solid var(--peach-200); outline-offset:2px; }
    [hidden] { display:none !important; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .icon { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .icon.sm { width:16px; height:16px; } .icon.lg { width:26px; height:26px; } .icon.fill { fill:currentColor; stroke:none; }
    [dir="ltr"] .flip { transform:scaleX(-1); }
    .num { font-variant-numeric:tabular-nums; }

    .wrap { width:100%; max-width:640px; margin:0 auto; padding-inline:16px; }

    /* ---------- header ---------- */
    .top { position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .top .wrap { display:flex; align-items:center; gap:10px; height:60px; }
    .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.15rem; border:0; background:none; padding:0; }
    .mark { width:34px; height:34px; border-radius:11px; background:var(--orange); color:#fff; display:grid; place-items:center; }
    .mark .icon { width:20px; height:20px; }
    .brand small { color:var(--muted); font-weight:500; font-size:.8rem; }
    .top .spacer { flex:1; }
    .pill-btn { height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:.85rem; }
    .view-head { display:flex; align-items:center; gap:10px; height:60px; }
    .view-head h1 { margin:0; font-size:1.1rem; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none; }

    main { padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
    main.flow { padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px)); }

    /* ---------- home ---------- */
    .loc { display:inline-flex; align-items:center; gap:6px; border:0; background:none; padding:4px 0; color:var(--ink-2); font-size:.85rem; }
    .loc strong { color:var(--ink); font-weight:600; }
    .loc .icon { color:var(--orange-strong); }
    .hello { margin:6px 0 2px; font-size:clamp(1.5rem, 6.4vw, 2rem); line-height:1.25; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
    .sub { margin:0; color:var(--ink-2); }

    .deal {
      margin-top:16px; border-radius:var(--r-xl); background:var(--peach-100); padding:18px; display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center; position:relative; overflow:hidden;
    }
    .deal::before { content:""; position:absolute; inset-inline-end:-30px; bottom:-50px; width:150px; height:150px; border-radius:50%; background:var(--peach-200); opacity:.55; }
    .deal .big { font-size:2.6rem; font-weight:700; line-height:1; color:var(--orange-ink); position:relative; }
    .deal .big small { font-size:1rem; font-weight:600; }
    .deal p { margin:0; position:relative; color:var(--ink-2); font-size:.9rem; }
    .deal strong { display:block; color:var(--ink); font-size:1rem; position:relative; }
    .deal .bubbles { grid-row:1 / span 2; grid-column:2; position:relative; width:74px; height:74px; }
    .deal .bubbles i { position:absolute; border-radius:50%; background:#fff; opacity:.9; }

    .label { font-size:.78rem; font-weight:600; color:var(--muted); letter-spacing:.04em; margin:22px 0 10px; }
    .services { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    .svc { border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-lg); padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:.78rem; font-weight:600; color:var(--ink-2); text-align:center; line-height:1.3; }
    .svc .ic { width:44px; height:44px; border-radius:14px; background:var(--peach-50); color:var(--orange-ink); display:grid; place-items:center; }
    .svc[aria-checked="true"] { border-color:var(--orange); background:var(--peach-50); color:var(--ink); }
    .svc[aria-checked="true"] .ic { background:var(--orange); color:#fff; }

    .row-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:26px 0 10px; }
    .row-head h2 { margin:0; font-size:1.1rem; font-weight:600; }
    .row-head .count { color:var(--muted); font-size:.85rem; }
    .search { display:flex; align-items:center; gap:8px; height:46px; padding:0 14px; border-radius:var(--r); background:var(--surface); border:1.5px solid var(--line); color:var(--muted); }
    .search:focus-within { border-color:var(--orange); }
    .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); height:100%; }
    .chips { display:flex; gap:8px; overflow-x:auto; margin:10px -16px 12px; padding:0 16px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { flex:none; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:.83rem; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; }
    .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
    .chip .icon { width:14px; height:14px; }

    .shops { display:grid; gap:10px; }
    .shop { display:flex; gap:12px; align-items:center; width:100%; text-align:start; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-lg); padding:12px; transition:transform .12s, box-shadow .15s; }
    .shop:hover { box-shadow:var(--shadow); }
    .shop:active { transform:scale(.99); }
    .avatar { width:56px; height:56px; border-radius:16px; flex:none; display:grid; place-items:center; font-weight:700; font-size:1.3rem; color:var(--orange-ink); background:var(--peach-50); border:1px solid var(--peach-100); }
    .shop .body { flex:1; min-width:0; }
    .shop .name { font-weight:600; font-size:.98rem; line-height:1.35; }
    .meta { display:flex; flex-wrap:wrap; gap:2px 12px; font-size:.8rem; color:var(--ink-2); margin-top:3px; }
    .meta span { display:inline-flex; align-items:center; gap:4px; }
    .meta .icon { width:13px; height:13px; color:var(--muted); }
    .meta .star { color:var(--star); }
    .state { font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:999px; }
    .state.open { background:var(--green-50); color:var(--green); }
    .state.closed { background:#f3ece7; color:var(--ink-2); }
    .shop > .chev { color:var(--muted); }
    .data-note { font-size:.75rem; color:var(--muted); text-align:center; margin:14px 0 0; }

    .empty { text-align:center; padding:34px 18px; border:1.5px dashed var(--line); border-radius:var(--r-lg); background:var(--surface); color:var(--ink-2); }
    .empty .ic { width:60px; height:60px; border-radius:20px; display:grid; place-items:center; margin:0 auto 12px; background:var(--peach-50); color:var(--orange-ink); }
    .empty strong { display:block; color:var(--ink); font-size:1.02rem; margin-bottom:4px; }

    /* ---------- shop ---------- */
    .shop-card { display:flex; gap:14px; align-items:center; padding:14px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); }
    .shop-card .avatar { width:62px; height:62px; }
    .shop-card .name { font-size:1.1rem; font-weight:700; line-height:1.3; }
    .shop-card .addr { font-size:.8rem; color:var(--muted); margin-top:2px; }
    .gmaps { display:inline-flex; align-items:center; gap:5px; color:var(--orange-ink); font-weight:600; font-size:.8rem; margin-top:6px; }
    .seg { display:flex; gap:4px; background:var(--peach-50); padding:4px; border-radius:var(--r); margin-top:14px; overflow-x:auto; scrollbar-width:none; }
    .seg::-webkit-scrollbar { display:none; }
    .seg button { flex:1 0 auto; border:0; background:transparent; height:40px; border-radius:11px; font-size:.82rem; font-weight:600; color:var(--ink-2); display:flex; align-items:center; justify-content:center; gap:5px; padding:0 12px; white-space:nowrap; }
    .seg button[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 2px 6px rgba(120,60,20,.1); }
    .seg .dot { min-width:18px; height:18px; border-radius:9px; background:var(--orange); color:#fff; font-size:.68rem; display:grid; place-items:center; padding:0 4px; }
    .items { margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
    .item { display:flex; align-items:center; gap:12px; padding:11px 12px; }
    .item + .item { border-top:1px solid var(--line); }
    .item .ic { width:42px; height:42px; border-radius:12px; background:var(--peach-50); color:var(--orange-ink); display:grid; place-items:center; flex:none; }
    .item .info { flex:1; min-width:0; }
    .item .info strong { display:block; font-weight:500; }
    .item .info span { font-size:.8rem; color:var(--muted); }
    .stepper { display:flex; align-items:center; gap:2px; }
    .stepper button { width:36px; height:36px; border-radius:11px; border:0; display:grid; place-items:center; background:var(--peach-50); color:var(--orange-ink); }
    .stepper button.plus.solo { background:var(--orange-strong); color:#fff; }
    .stepper output { min-width:28px; text-align:center; font-weight:600; }
    .hint { display:flex; gap:8px; align-items:flex-start; font-size:.82rem; color:var(--ink-2); background:var(--peach-50); border-radius:var(--r); padding:10px 12px; margin-top:12px; }
    .hint .icon { color:var(--orange-ink); width:17px; height:17px; margin-top:2px; }
    .hint.warn { background:#fff4dc; }

    /* ---------- action bar ---------- */
    .actionbar { position:fixed; inset-inline:0; bottom:0; z-index:35; background:var(--surface); border-top:1px solid var(--line); padding:12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 20px; border-radius:var(--r); border:0; background:var(--orange-strong); color:#fff; font-weight:600; font-size:1rem; transition:filter .15s, transform .1s; }
    .btn:hover { filter:brightness(.96); }
    .btn:active { transform:scale(.985); }
    .btn[disabled] { background:#e9ddd4; color:var(--muted); pointer-events:none; }
    .btn.full { width:100%; }
    .btn.soft { background:var(--peach-50); color:var(--orange-ink); }
    .btn.line { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
    .btn.wa { background:#1da851; }
    .btn.sm { height:40px; font-size:.88rem; padding:0 14px; border-radius:var(--r-sm); }
    .btn .grow { flex:1; text-align:start; }
    .btn .qty { background:rgba(255,255,255,.22); border-radius:8px; padding:1px 8px; font-size:.85rem; }

    /* ---------- checkout ---------- */
    .block { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; margin-top:12px; }
    .block-head { display:flex; align-items:center; gap:10px; }
    .block-head .ic { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--peach-50); color:var(--orange-ink); flex:none; }
    .block-head .t { flex:1; min-width:0; }
    .block-head .t small { display:block; font-size:.75rem; color:var(--muted); font-weight:500; }
    .block-head .t b { font-weight:600; display:block; overflow-wrap:anywhere; }
    .link-btn { border:0; background:none; color:var(--orange-ink); font-weight:600; font-size:.85rem; padding:6px 2px; flex:none; }
    .days { display:flex; gap:8px; overflow-x:auto; margin:14px -14px 0; padding:0 14px 2px; scrollbar-width:none; }
    .days::-webkit-scrollbar { display:none; }
    .day { flex:none; width:64px; padding:7px 0; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); text-align:center; line-height:1.3; }
    .day small { display:block; font-size:.7rem; color:var(--muted); }
    .day b { font-size:1.05rem; }
    .day[aria-pressed="true"] { border-color:var(--orange); background:var(--peach-50); }
    .day[disabled] { opacity:.4; }
    .slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
    .slot { height:42px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface); font-size:.82rem; font-weight:500; }
    .slot[aria-pressed="true"] { background:var(--orange-strong); border-color:var(--orange-strong); color:#fff; }
    .slot[disabled] { color:#cbbcb1; text-decoration:line-through; background:#fcf7f3; }
    .opts { display:grid; gap:8px; margin-top:12px; }
    .opt { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; text-align:start; width:100%; }
    .opt:has(input:checked) { border-color:var(--orange); background:var(--peach-50); }
    .opt input { accent-color:var(--orange-strong); width:18px; height:18px; margin:0; flex:none; }
    .opt .tx { flex:1; min-width:0; }
    .opt .tx b { display:block; font-weight:500; }
    .opt .tx small { color:var(--muted); font-size:.78rem; overflow-wrap:anywhere; }
    .field { display:grid; gap:6px; margin-top:12px; }
    .field > span { font-size:.85rem; font-weight:500; color:var(--ink-2); }
    .input { width:100%; min-height:48px; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); padding:0 14px; outline:none; }
    textarea.input { padding:12px 14px; resize:vertical; min-height:70px; }
    .input:focus { border-color:var(--orange); box-shadow:0 0 0 4px var(--peach-50); }
    .input.bad { border-color:var(--red); }
    .err { color:var(--red); font-size:.8rem; font-weight:500; }
    .okmsg { color:var(--green); font-size:.8rem; font-weight:500; }
    .inline { display:flex; gap:8px; }
    .inline .input { flex:1; min-width:0; }
    .tags { display:flex; gap:8px; flex-wrap:wrap; }
    .tag { height:36px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:.85rem; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
    .tag[aria-pressed="true"] { border-color:var(--orange); background:var(--peach-50); color:var(--orange-ink); }
    .kv { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:.9rem; }
    .kv span:first-child { color:var(--ink-2); }
    .kv.total { border-top:1px dashed var(--line); margin-top:8px; padding-top:12px; font-weight:700; font-size:1.02rem; }
    .kv.total span:first-child { color:var(--ink); }
    .kv.disc span:last-child { color:var(--green); }
    details.promo summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; color:var(--orange-ink); font-weight:600; font-size:.88rem; }
    details.promo summary::-webkit-details-marker { display:none; }

    /* ---------- done / orders ---------- */
    .done { text-align:center; padding:30px 0 6px; }
    .done .ring { width:92px; height:92px; border-radius:50%; margin:0 auto 18px; display:grid; place-items:center; color:#fff; background:var(--green); box-shadow:0 0 0 12px var(--green-50); animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
    .done h2 { margin:0 0 6px; font-size:1.4rem; }
    .done p { margin:0 auto; color:var(--ink-2); max-width:34ch; }
    .page-title { font-size:1.45rem; font-weight:700; margin:12px 0 14px; }
    .order { display:grid; gap:10px; width:100%; text-align:start; padding:14px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); margin-bottom:10px; }
    .order .top-row { display:flex; align-items:center; gap:12px; }
    .order .avatar { width:44px; height:44px; font-size:1rem; border-radius:13px; }
    .badge { font-size:.74rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--peach-50); color:var(--orange-ink); flex:none; }
    .badge.ok { background:var(--green-50); color:var(--green); }
    .bar { height:6px; border-radius:6px; background:var(--peach-50); overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--orange); border-radius:6px; }
    .tl { list-style:none; margin:0; padding:0; }
    .tl li { display:flex; gap:12px; position:relative; padding-bottom:18px; }
    .tl li:last-child { padding-bottom:0; }
    .tl li::before { content:""; position:absolute; inset-inline-start:13px; top:28px; bottom:0; width:2px; background:var(--line); }
    .tl li:last-child::before { display:none; }
    .tl li.done::before { background:var(--orange); }
    .tl .dot { width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; background:#f3ece7; color:var(--muted); position:relative; }
    .tl li.done .dot { background:var(--orange); color:#fff; }
    .tl li.now .dot { background:var(--surface); color:var(--orange-ink); box-shadow:0 0 0 2px var(--orange), 0 0 0 7px var(--peach-50); }
    .tl b { display:block; font-weight:600; font-size:.92rem; }
    .tl span { font-size:.8rem; color:var(--muted); }
    .tl li.later b { color:var(--muted); font-weight:400; }

    /* ---------- account / help ---------- */
    .profile { display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--r-lg); background:var(--peach-100); }
    .profile .avatar { background:var(--surface); border:0; }
    .profile b { display:block; font-size:1.1rem; }
    .profile div > span { color:var(--ink-2); font-size:.9rem; direction:ltr; display:inline-block; }
    .list { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); margin-top:12px; }
    .list-row { display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; text-align:start; border:0; background:none; }
    .list-row + .list-row { border-top:1px solid var(--line); }
    .list-row .ic { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--peach-50); color:var(--orange-ink); flex:none; }
    .list-row .tx { flex:1; min-width:0; }
    .list-row .tx b { display:block; font-weight:500; }
    .list-row .tx small { color:var(--muted); font-size:.8rem; overflow-wrap:anywhere; }
    .list-row .mini { border:0; background:none; color:var(--muted); width:34px; height:34px; border-radius:10px; display:grid; place-items:center; }
    .list-row .mini:hover { background:var(--peach-50); color:var(--red); }
    .def { font-size:.7rem; font-weight:600; color:var(--green); background:var(--green-50); padding:1px 8px; border-radius:999px; margin-inline-start:6px; }
    .wa-card { padding:18px; border-radius:var(--r-xl); background:var(--surface); border:1px solid var(--line); text-align:center; }
    .wa-card .ic { width:60px; height:60px; border-radius:20px; display:grid; place-items:center; margin:0 auto 10px; background:#e5f7ec; color:#1da851; }
    .wa-card h2 { margin:0 0 4px; font-size:1.15rem; }
    .wa-card p { margin:0 0 14px; color:var(--ink-2); font-size:.9rem; }
    .phone-line { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 10px; margin-top:12px; font-size:.95rem; }
    .phone-line b { white-space:nowrap; direction:ltr; user-select:all; letter-spacing:.03em; }
    .faq { margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
    .faq details + details { border-top:1px solid var(--line); }
    .faq summary { list-style:none; cursor:pointer; padding:14px; font-weight:500; display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .faq summary::-webkit-details-marker { display:none; }
    .faq summary .icon { color:var(--muted); transition:transform .2s; }
    .faq details[open] summary .icon { transform:rotate(180deg); }
    .faq p { margin:0; padding:0 14px 14px; color:var(--ink-2); font-size:.9rem; }

    /* ---------- tab bar ---------- */
    .tabbar { position:fixed; inset-inline:0; bottom:0; z-index:35; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
    .tabbar .in { max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(4, 1fr); height:var(--nav-h); }
    .tabbar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:.72rem; font-weight:500; color:var(--muted); position:relative; }
    .tabbar button[aria-current="page"] { color:var(--orange-ink); }
    .tabbar button[aria-current="page"] .icon { stroke-width:2.4; }
    .tabbar .n { position:absolute; top:8px; inset-inline-start:calc(50% + 5px); min-width:17px; height:17px; border-radius:9px; background:var(--orange-strong); color:#fff; font-size:.65rem; font-weight:700; display:grid; place-items:center; padding:0 4px; }

    /* ---------- sheet ---------- */
    .scrim { position:fixed; inset:0; z-index:60; background:rgba(43,29,20,.45); opacity:0; pointer-events:none; transition:opacity .25s; }
    .scrim.on { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; z-index:61; inset-inline:0; bottom:0; max-width:640px; margin:0 auto; max-height:90dvh; overflow:auto; background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateY(105%); visibility:hidden; transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; box-shadow:var(--shadow-lg); }
    .sheet.on { transform:none; visibility:visible; transition-delay:0s; }
    .grab { width:40px; height:5px; border-radius:3px; background:var(--peach-200); margin:0 auto 10px; }
    .sheet h2 { margin:6px 0 4px; font-size:1.2rem; }
    .sheet .lead { margin:0 0 12px; color:var(--ink-2); font-size:.9rem; }
    .otp { display:flex; gap:10px; justify-content:center; direction:ltr; margin:8px 0 4px; }
    .otp input { width:56px; height:60px; text-align:center; font-size:1.5rem; font-weight:600; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); outline:none; }
    .otp input:focus { border-color:var(--orange); box-shadow:0 0 0 4px var(--peach-50); }
    .demo-code { text-align:center; font-size:.82rem; color:var(--ink-2); background:#fff4dc; border-radius:var(--r-sm); padding:8px; margin-top:10px; }
    .demo-code b { letter-spacing:.2em; direction:ltr; display:inline-block; }
    .phone-in { display:flex; align-items:center; gap:0; direction:ltr; border:1.5px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; }
    .phone-in:focus-within { border-color:var(--orange); box-shadow:0 0 0 4px var(--peach-50); }
    .phone-in span { padding:0 12px; color:var(--muted); border-inline-end:1px solid var(--line); height:50px; display:grid; place-items:center; font-weight:500; }
    .phone-in input { flex:1; min-width:0; border:0; outline:0; height:50px; padding:0 12px; font-size:1.05rem; letter-spacing:.04em; background:transparent; }
    .stack { display:grid; gap:10px; margin-top:16px; }

    .toast { position:fixed; z-index:80; left:50%; top:calc(68px + env(safe-area-inset-top, 0px)); transform:translate(-50%, -16px); opacity:0; pointer-events:none; background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:.86rem; font-weight:500; display:flex; align-items:center; gap:8px; transition:all .25s; max-width:calc(100% - 32px); box-shadow:var(--shadow-lg); }
    .toast.on { opacity:1; transform:translate(-50%, 0); }

    @keyframes pop { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
    @media (max-width:360px) { .services { grid-template-columns:repeat(2, 1fr); } }
    @media (min-width:700px) {
      .wrap { max-width:720px; }
      .shops { grid-template-columns:1fr 1fr; }
      .sheet { bottom:auto; top:50%; border-radius:var(--r-xl); transform:translateY(-46%); opacity:0; transition:transform .25s, opacity .25s, visibility 0s .25s; width:min(520px, calc(100% - 32px)); inset-inline:0; }
      .sheet.on { transform:translateY(-50%); opacity:1; }
      .grab { display:none; }
    }
  </style>

    /* ============ Storage (best effort) ============ */

      set(k, v) { mem[k] = JSON.stringify(v); try { localStorage.setItem(k, mem[k]); } catch {} },
      del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch {} }
    };

    /* ============ State ============ */
    const S = {
      lang: store.get(K.lang, 'ar') === 'en' ? 'en' : 'ar',

    const ic = (id, cls = '') => `<svg class="icon ${cls}"><use href="#${id}"/></svg>`;

    const dist = s => S.lang === 'ar' ? s.dist_ar : s.dist_en;
    const shop = id => SHOPS.find(s => s.id === id);

    const money = n => { const v = Number.isInteger(n) ? n : n.toFixed(2); return S.lang === 'ar' ? `${v} ر.س` : `SAR ${v}`; };

    function km(a, b) {
      const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
      const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLo/2)**2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const fmtKm = d => `${d < 10 ? d.toFixed(1) : Math.round(d)} ${t('km')}`;

      checkout() {
        const u = me(), tot = totals(), s = shop(S.shopId);

        if (addrs.length && !addrs.some(a => a.id === S.addrId)) S.addrId = (addrs.find(a => a.def) || addrs[0]).id;
        const days = Array.from({ length:DAYS }, (_, i) => {
          const d = dayAt(i), any = slotsOf(i).some(x => x.ok);

          return `<button type="button" class="day" aria-pressed="${S.dayIdx === i}" data-day="${i}" ${any ? '' : 'disabled'}><small>${top}</small><b class="num">${d.getDate()}</b><small>${d.toLocaleDateString(loc(), { month:'short' })}</small></button>`;

          : `<div style="grid-column:1/-1;color:var(--muted);font-size:.85rem">${t('noSlots')}</div>`;

              <button type="button" class="link-btn" data-pickslot>${S.pickSlot ? t('done') : t('change')}</button></div>
            ${S.pickSlot ? `<div class="days">${days}</div><div class="slots">${slotHtml}</div><p style="margin:10px 0 0;font-size:.78rem;color:var(--muted)">${t('leadNote')}</p>` : ''}
          </section>

          <section class="block">
            <div class="block-head"><span class="ic">${ic('i-pin')}</span><div class="t"><b>${t('address')}</b></div>
              ${addrs.length ? `<button type="button" class="link-btn" data-addaddr>${t('addAddress')}</button>` : ''}</div>
            ${addrs.length ? `<div class="opts">${addrs.map(a => `
                <label class="opt"><input type="radio" name="addr" value="${a.id}" ${S.addrId === a.id ? 'checked' : ''} />
                  <span class="tx"><b>${t('lbl_' + a.label)}</b><small>${esc(a.text)}</small></span>${ic(a.label === 'work' ? 'i-work' : 'i-home')}</label>`).join('')}</div>`
              : addrForm(S.draftAddr, 'draft')}
          </section>

          <section class="block">
            <div class="block-head"><span class="ic">${ic('i-cash')}</span><div class="t"><b>${t('payment')}</b><small>${t('pay_note')}</small></div></div>
            <div class="opts">
              ${['cash', 'card'].map(p => `<label class="opt"><input type="radio" name="pay" value="${p}" ${S.pay === p ? 'checked' : ''} /><span class="tx"><b>${t('pay_' + p)}</b></span>${ic(p === 'cash' ? 'i-cash' : 'i-card')}</label>`).join('')}
            </div>
            <label class="field"><span>${t('notes')} <small style="color:var(--muted)">· ${t('optional')}</small></span>
              <textarea class="input" id="notes" rows="2" placeholder="${t('notesPh')}">${esc(S.notes)}</textarea></label>
          </section>

          <section class="block">
            <div class="block-head" style="margin-bottom:8px"><span class="avatar" style="width:38px;height:38px;font-size:.95rem;border-radius:12px">${esc(initial(s))}</span><div class="t"><small>${t('items')}</small><b>${esc(nm(s))}</b></div></div>
            ${tot.list.map(e => `<div class="kv"><span>${e.q} × ${t('item_' + e.item.id)} <small style="color:var(--muted)">· ${t('svc_' + e.svc)}</small></span><span class="num">${money(e.q * ITEM_PRICE)}</span></div>`).join('')}
            <div style="border-top:1px solid var(--line);margin:8px 0 4px"></div>
            <div class="kv"><span>${t('subtotal')}</span><span class="num">${money(tot.sub)}</span></div>
            ${tot.disc ? `<div class="kv disc"><span>${t('discount')} · ${PROMO.code}</span><span class="num">−${money(tot.disc)}</span></div>` : ''}
            <div class="kv"><span>${t('fee')}</span><span class="num">${money(tot.fee)}</span></div>
            <div class="kv total"><span>${t('total')}</span><span class="num">${money(tot.total)}</span></div>
            <details class="promo" style="margin-top:10px" ${S.promoOn || S.promoErr || S.promoIn ? 'open' : ''}>
              <summary>${ic('i-tag', 'sm')}${t('promo')}</summary>
              ${S.promoOn
                ? `<div class="inline" style="margin-top:10px;align-items:center"><span class="okmsg" style="flex:1">${t('promoOk')}</span><button type="button" class="btn line sm" data-unpromo>${t('remove')}</button></div>`
                : `<div class="inline" style="margin-top:10px"><input class="input ${S.promoErr ? 'bad' : ''}" id="promo" value="${esc(S.promoIn)}" placeholder="${t('promoPh')}" autocapitalize="characters" /><button type="button" class="btn line sm" style="height:48px" data-promo>${t('apply')}</button></div>
                   ${S.promoErr ? `<div class="err" style="margin-top:6px">${t('promoBad')}</div>` : ''}`}
            </details>
          </section>`;
      },

      done() {
        const o = myOrders().find(x => x.id === S.lastOrder);
        setAction(`<div style="display:grid;gap:8px"><button type="button" class="btn full" data-open-order="${o.id}">${ic('i-truck')}${t('track')}</button><button type="button" class="btn soft full" data-go="home">${t('home')}</button></div>`);
        return `<div class="done"><div class="ring">${ic('i-check', 'lg')}</div><h2>${t('doneTitle')}</h2><p>${t('doneBody')}</p></div>
          <section class="block">
            <div class="kv"><span>${t('order')}</span><b class="num">#${o.id}</b></div>
            <div class="kv"><span>${t('pickup')}</span><span style="text-align:end">${esc(slotLabel(o.slot))}</span></div>
            <div class="kv"><span>${t('items')}</span><span>${t('pcs', { n:o.count })}</span></div>
            <div class="kv total"><span>${t('total')}</span><span class="num">${money(o.total)}</span></div>
          </section>`;
      },

      orders() {
        setAction('');
        if (!me()) return `<h1 class="page-title">${t('ordersTitle')}</h1>${guestCard(t('guestOrders'))}`;
        const list = myOrders().slice().reverse();
        return `<h1 class="page-title">${t('ordersTitle')}</h1>` + (list.length ? list.map(o => {
          const s = shop(o.shopId), st = o.step || 0;
          return `<button type="button" class="order" data-open-order="${o.id}">
            <div class="top-row"><span class="avatar">${esc(initial(s))}</span>
              <div style="flex:1;min-width:0"><b style="display:block;font-weight:600">${esc(nm(s))}</b><small style="color:var(--muted)">#${o.id} · ${t('pcs', { n:o.count })} · <span class="num">${money(o.total)}</span></small></div>
              <span class="badge ${st === 4 ? 'ok' : ''}">${t('st' + st)}</span></div>
            <div class="bar"><i style="width:${(st + 1) * 20}%"></i></div>
            <small style="color:var(--ink-2)">${ic('i-cal', 'sm')} ${esc(slotLabel(o.slot))}</small>
          </button>`;
        }).join('') : `<div class="empty"><div class="ic">${ic('i-bag', 'lg')}</div><strong>${t('noOrders')}</strong>${t('noOrdersBody')}
          <div style="margin-top:14px"><button class="btn sm" type="button" data-go="home">${t('browse')}</button></div></div>`);
      },

      order() {
        const o = myOrders().find(x => x.id === S.params.id);
        setAction('');
        if (!o) return '';
        const s = shop(o.shopId), st = o.step || 0;
        const ret = new Date(new Date(o.slot).getTime() + 48 * 3600e3);
        const steps = [0, 1, 2, 3, 4].map(i => {
          const cls = i < st || st === 4 ? 'done' : i === st ? 'now' : 'later';
          const sub = i === 1 ? slotLabel(o.slot) : i === 4 && st < 4 ? dayLabel(ret) : t('st' + i + 'd');
          return `<li class="${cls}"><span class="dot">${cls === 'later' ? '' : ic('i-check', 'sm')}</span><div><b>${t('st' + i)}</b><span>${esc(sub)}</span></div></li>`;
        }).join('');
        return `
          <section class="block" style="margin-top:4px">
            <div class="block-head" style="margin-bottom:14px"><span class="avatar" style="width:44px;height:44px;font-size:1rem;border-radius:13px">${esc(initial(s))}</span>
              <div class="t"><b>${esc(nm(s))}</b><small>${t('pcs', { n:o.count })} · ${money(o.total)}</small></div><span class="badge ${st === 4 ? 'ok' : ''}">${t('st' + st)}</span></div>
            <ol class="tl">${steps}</ol>
            ${st < 4 ? `<button type="button" class="btn line sm" style="width:100%;margin-top:16px" data-step="${o.id}">${t('demoNext')}</button>` : ''}
          </section>
          <section class="block">
            <div class="kv"><span>${t('pickup')}</span><span style="text-align:end">${esc(slotLabel(o.slot))}</span></div>
            <div class="kv"><span>${t('returnBy')}</span><span>${esc(dayLabel(ret))}</span></div>
            <div class="kv"><span>${t('address')}</span><span style="text-align:end;overflow-wrap:anywhere">${esc(o.address)}</span></div>
            <div class="kv"><span>${t('paidBy')}</span><span>${t('pay_' + o.pay)}</span></div>
          </section>
          <section class="block">
            ${o.lines.map(l => `<div class="kv"><span>${l.q} × ${t('item_' + l.item)} <small style="color:var(--muted)">· ${t('svc_' + l.svc)}</small></span><span class="num">${money(l.q * ITEM_PRICE)}</span></div>`).join('')}
            <div style="border-top:1px solid var(--line);margin:8px 0 4px"></div>
            <div class="kv"><span>${t('subtotal')}</span><span class="num">${money(o.sub)}</span></div>
            ${o.disc ? `<div class="kv disc"><span>${t('discount')}</span><span class="num">−${money(o.disc)}</span></div>` : ''}
            <div class="kv"><span>${t('fee')}</span><span class="num">${money(o.fee)}</span></div>
            <div class="kv total"><span>${t('total')}</span><span class="num">${money(o.total)}</span></div>
          </section>
          <div class="stack" style="margin-top:12px">
            <a class="btn wa full" href="${waLink(t('waMsgOrder', { id:o.id }))}" target="_blank" rel="noopener">${ic('i-wa')}${t('chatAbout')}</a>
            <button type="button" class="btn soft full" data-reorder="${o.id}">${t('reorder')}</button>
          </div>`;
      },

      account() {
        setAction('');
        const u = me();
        const langRow = `<button type="button" class="list-row" data-lang><span class="ic">${ic('i-globe')}</span><span class="tx"><b>${t('language')}</b><small>${t('langName')}</small></span>${ic('i-chev', 'sm')}</button>`;
        if (!u) return `<h1 class="page-title">${t('accountTitle')}</h1>${guestCard(t('guestBody'))}<div class="list">${langRow}</div>`;
        const addrs = u.addresses || [];
        return `<h1 class="page-title">${t('accountTitle')}</h1>
          <div class="profile"><span class="avatar">${esc(u.name.charAt(0))}</span><div><b>${esc(u.name)}</b><span>${fmtPhone(S.phone)}</span></div></div>
          <div class="row-head" style="margin-top:22px"><h2>${t('addresses')}</h2><button type="button" class="link-btn" data-addaddr>${ic('i-plus', 'sm')} ${t('addAddress')}</button></div>
          <div class="list" style="margin-top:0">${addrs.length ? addrs.map(a => `
            <div class="list-row"><span class="ic">${ic(a.label === 'work' ? 'i-work' : 'i-home')}</span>
              <span class="tx"><b>${t('lbl_' + a.label)}${a.def ? `<span class="def">${t('deflt')}</span>` : ''}</b><small>${esc(a.text)}</small>
                ${a.def ? '' : `<br><button type="button" class="link-btn" style="padding:4px 0" data-defaddr="${a.id}">${t('makeDefault')}</button>`}</span>
              <button type="button" class="mini" data-deladdr="${a.id}" aria-label="delete">${ic('i-trash', 'sm')}</button></div>`).join('')
            : `<div class="list-row"><span class="tx"><small>${t('noAddr')}</small></span></div>`}</div>
          <div class="list">${langRow}<button type="button" class="list-row" data-logout><span class="ic">${ic('i-logout')}</span><span class="tx"><b>${t('logout')}</b></span></button></div>`;
      },

      help() {
        setAction('');
        return `<h1 class="page-title">${t('helpTitle')}</h1>
          <div class="wa-card">
            <div class="ic">${ic('i-wa', 'lg')}</div>
            <h2>${t('waTitle')}</h2><p>${t('waBody')}</p>
            <a class="btn wa full" href="${waLink(t('waMsg'))}" target="_blank" rel="noopener">${ic('i-wa')}${t('openWa')}</a>
            <div class="phone-line"><span style="color:var(--ink-2)">${t('orCall')}</span><b class="num">${WA_DISPLAY}</b>
              <button type="button" class="btn line sm" style="height:34px" data-copyphone>${ic('i-copy', 'sm')}${t('copy')}</button></div>
          </div>
          <div class="row-head"><h2>${t('faq')}</h2></div>
          <div class="faq" style="margin-top:0">${[1,2,3,4].map(i => `<details><summary>${t('q' + i)}${ic('i-down', 'sm')}</summary><p>${t('a' + i)}</p></details>`).join('')}</div>`;
      }
    };

    function shopRow(s) {
      return `<button type="button" class="shop" data-shop="${s.id}">
        <span class="avatar">${esc(initial(s))}</span>
        <span class="body">
          <span class="name" style="display:block">${esc(nm(s))}</span>
          <span class="meta"><span>${ic('i-star', 'fill star')}${s.rating.toFixed(1)}</span><span>${ic('i-pin')}<span class="num">${fmtKm(s.d)}</span> · ${esc(dist(s))}</span>
            <span class="state ${s.open ? 'open' : 'closed'}">${t(s.open ? 'open' : 'closed')}</span></span>
        </span>
        ${ic('i-chev', 'sm chev' + (S.lang === 'en' ? ' flip' : ''))}
      </button>`;
    }
    function guestCard(body) {
      return `<div class="empty"><div class="ic">${ic('i-user', 'lg')}</div><strong>${t('guestTitle')}</strong>${body}
        <div style="margin-top:14px"><button class="btn sm" type="button" data-login>${t('login')}</button></div></div>`;
    }
    function addrForm(a, mode) {
      return `<div class="field"><span>${t('addrLabel')}</span><div class="tags">
          ${['home', 'work', 'other'].map(l => `<button type="button" class="tag" aria-pressed="${a.label === l}" data-albl="${l}" data-amode="${mode}">${ic(l === 'work' ? 'i-work' : 'i-home', 'sm')}${t('lbl_' + l)}</button>`).join('')}</div></div>
        <label class="field"><span>${t('addrDetails')}</span>
          <textarea class="input ${S.errs.addr ? 'bad' : ''}" id="addrText-${mode}" rows="2" placeholder="${t('addrPh')}">${esc(a.text)}</textarea></label>
        ${S.errs.addr ? `<div class="err" style="margin-top:6px">${t('errAddr')}</div>` : ''}
        <button type="button" class="link-btn" style="margin-top:6px" data-locate="${mode}">${ic('i-locate', 'sm')} ${t('locateMe')}</button>`;
    }

    /* ============ Router ============ */
    const history_ = [];
    function go(view, params = {}, push = true) {
      if (push && S.view !== view) history_.push({ view:S.view, params:S.params });
      if (view === 'checkout' && !totals().count) view = 'shop';
      S.view = view; S.params = params;
      if (view !== 'checkout') S.pickSlot = false;
      render();
      window.scrollTo({ top:0 });
    }
    function back() {
      const prev = history_.pop();
      captureInputs();
      if (prev && prev.view !== 'done') go(prev.view, prev.params, false); else go('home', {}, false);
    }
    function render() {
      document.documentElement.lang = S.lang;
      document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
      document.title = S.lang === 'ar' ? 'غسله Wash' : 'Washla';
      renderTop();
      $('#view').innerHTML = views[S.view]();
      renderChrome();
    }
    function captureInputs() {
      if ($('#notes')) S.notes = $('#notes').value;
      if ($('#promo')) S.promoIn = $('#promo').value;
      if ($('#addrText-draft')) S.draftAddr.text = $('#addrText-draft').value;
    }

    /* ============ Sheet ============ */
    function openSheet(html, label) {
      $('#sheetIn').innerHTML = html; $('#sheet').setAttribute('aria-label', label || '');
      $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); document.body.classList.add('lock');
      setTimeout(() => $('#sheet input, #sheet textarea')?.focus({ preventScroll:true }), 120);
    }
    function closeSheet() {
      $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.classList.remove('lock');
      S.errs = {};
    }

    /* login flow (simulated SMS) */
    const L = { phone:'', code:'', step:'phone', err:false };
    function loginSheet() {
      if (L.step === 'phone') return openSheet(`
        <h2>${t('loginTitle')}</h2><p class="lead">${t('loginLead')}</p>
        <label class="field" style="margin-top:0"><span>${t('phone')}</span>
          <span class="phone-in"><span>+966</span><input id="phoneIn" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="${t('phonePh')}" value="${esc(L.phone.replace(/^0/, ''))}" maxlength="12" /></span></label>
        ${L.err ? `<div class="err" style="margin-top:6px">${t('errPhone')}</div>` : ''}
        <div class="stack"><button type="button" class="btn full" data-sendcode>${t('sendCode')}</button></div>`, t('loginTitle'));
      if (L.step === 'code') return openSheet(`
        <h2>${t('codeTitle')}</h2><p class="lead">${t('codeLead')} <b class="num" style="direction:ltr;display:inline-block">${fmtPhone(L.phone)}</b></p>
        <div class="otp">${[0,1,2,3].map(i => `<input id="otp${i}" inputmode="numeric" maxlength="1" aria-label="${i + 1}" autocomplete="${i ? 'off' : 'one-time-code'}" />`).join('')}</div>
        ${L.err ? `<div class="err" style="text-align:center">${t('errCode')}</div>` : ''}
        <div class="demo-code">${t('demoCode')} <b>${L.code}</b></div>
        <div class="stack"><button type="button" class="btn full" data-verify>${t('verify')}</button>
          <button type="button" class="btn line full" data-editphone>${t('editPhone')}</button></div>`, t('codeTitle'));
      return openSheet(`
        <h2>${t('nameTitle')}</h2><p class="lead">${t('nameLead')}</p>
        <input class="input ${L.err ? 'bad' : ''}" id="nameIn" autocomplete="name" placeholder="${t('namePh')}" />
        ${L.err ? `<div class="err" style="margin-top:6px">${t('errName')}</div>` : ''}
        <div class="stack"><button type="button" class="btn full" data-savename>${t('save')}</button></div>`, t('nameTitle'));
    }
    function startLogin(then) { S.pending = then || null; Object.assign(L, { phone:'', code:'', step:'phone', err:false }); loginSheet(); }
    function finishLogin() {
      store.set(K.session, S.phone);
      closeSheet();
      toast(t('welcome', { name:me().name.split(' ')[0] }), 'i-user');
      const p = S.pending; S.pending = null;
      render();
      if (p) p();
    }

    /* address sheet */
    const A = { label:'home', text:'' };
    function addrSheet() {
      openSheet(`<h2>${t('newAddress')}</h2>${addrForm(A, 'sheet')}
        <div class="stack"><button type="button" class="btn full" data-saveaddr>${t('saveAddr')}</button></div>`, t('newAddress'));
    }
    function addAddress(a) {
      const u = me(); const list = u.addresses || [];
      const rec = { id:'a' + Date.now().toString(36), label:a.label, text:a.text.trim(), def: !list.length };
      u.addresses = [...list, rec]; saveMe(u); return rec;
    }

    /* place order */
    function place() {
      captureInputs();
      const u = me();
      if (!u) { startLogin(() => { if (S.view === 'checkout') place(); }); return; }
      let addr = (u.addresses || []).find(a => a.id === S.addrId);
      if (!addr) {
        if (!S.draftAddr.text.trim()) { S.errs.addr = true; render(); $('#addrText-draft')?.focus(); return; }
        addr = addAddress(S.draftAddr); S.addrId = addr.id; S.draftAddr = { label:'home', text:'' };
      }
      if (!S.slot || new Date(S.slot).getTime() < minTime()) { S.slot = null; render(); toast(t('noSlots'), 'i-clock'); return; }
      const tot = totals();
      const o = {
        id: String(Date.now()).slice(-6), shopId:S.shopId, slot:S.slot, address:`${t('lbl_' + addr.label)} — ${addr.text}`,
        lines: tot.list.map(e => ({ svc:e.svc, item:e.item.id, q:e.q })), count:tot.count, sub:tot.sub, disc:tot.disc, fee:tot.fee, total:tot.total,
        pay:S.pay, notes:S.notes, createdAt:Date.now(), step:0
      };
      saveOrders([...myOrders(), o]);
      S.lastOrder = o.id;
      S.cart = {}; S.promoOn = false; S.promoIn = ''; S.promoErr = false; S.notes = ''; S.slot = null; S.errs = {};
      history_.length = 0;
      go('done', {}, false);
    }

    function locateInto(mode) {
      const set = txt => {
        if (mode === 'sheet') { A.text = txt; addrSheet(); }
        else { S.draftAddr.text = txt; render(); }
      };
      if (mode === 'sheet') A.text = $('#addrText-sheet')?.value || A.text; else captureInputs();
      if (!navigator.geolocation) { toast(t('locFail'), 'i-pin'); return; }
      toast(t('locating'), 'i-locate');
      navigator.geolocation.getCurrentPosition(
        p => set(`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`),
        () => toast(t('locFail'), 'i-pin'), { timeout:8000 });
    }

    /* ============ Events ============ */
    document.addEventListener('click', e => {
      const b = e.target.closest('button, a'); if (!b) return;
      const d = b.dataset;
      if (b.tagName === 'A') return;                       // real links (WhatsApp, Maps) open normally

      if (d.go) return go(d.go);
      if ('back' in d) return back();
      if ('lang' in d) { S.lang = S.lang === 'ar' ? 'en' : 'ar'; store.set(K.lang, S.lang); captureInputs(); render(); if ($('#sheet').classList.contains('on')) closeSheet(); return; }
      if (d.svc) { S.service = d.svc; render(); return; }
      if (d.sort) { S.sort = d.sort; render(); return; }
      if ('open' in d) { S.openOnly = !S.openOnly; render(); return; }
      if ('clear' in d) { S.q = ''; S.openOnly = false; render(); return; }
      if (d.shop) {
        if (S.shopId !== d.shop) { S.cart = {}; S.promoOn = false; }
        S.shopId = d.shop; S.tab = S.service; return go('shop');
      }
      if (d.tab) { S.tab = d.tab; render(); return; }
      if (d.q) {
        const n = Math.max(0, Math.min(99, (S.cart[d.q] || 0) + Number(d.d)));
        if (n) S.cart[d.q] = n; else delete S.cart[d.q];
        render(); return;
      }
      if ('pickslot' in d) { captureInputs(); S.pickSlot = !S.pickSlot; render(); return; }
      if (d.day) { captureInputs(); S.dayIdx = Number(d.day); render(); return; }
      if (d.slot) { captureInputs(); S.slot = d.slot; render(); return; }
      if (d.albl) {
        if (d.amode === 'sheet') { A.text = $('#addrText-sheet').value; A.label = d.albl; addrSheet(); }
        else { captureInputs(); S.draftAddr.label = d.albl; render(); }
        return;
      }
      if (d.locate) return locateInto(d.locate);
      if ('addaddr' in d) { captureInputs(); A.label = 'home'; A.text = ''; S.errs = {}; return addrSheet(); }
      if ('saveaddr' in d) {
        A.text = $('#addrText-sheet').value;
        if (!A.text.trim()) { S.errs.addr = true; return addrSheet(); }
        const rec = addAddress(A); S.addrId = rec.id; S.errs = {}; closeSheet(); render(); return;
      }
      if (d.defaddr) { const u = me(); u.addresses.forEach(a => { a.def = a.id === d.defaddr; }); saveMe(u); render(); return; }
      if (d.deladdr) {
        const u = me(); u.addresses = u.addresses.filter(a => a.id !== d.deladdr);
        if (u.addresses.length && !u.addresses.some(a => a.def)) u.addresses[0].def = true;
        saveMe(u); render(); return;
      }
      if ('promo' in d) {
        captureInputs();
        if (S.promoIn.trim().toUpperCase() === PROMO.code) { S.promoOn = true; S.promoErr = false; toast(t('promoOk'), 'i-tag'); }
        else S.promoErr = true;
        render(); return;
      }
      if ('unpromo' in d) { captureInputs(); S.promoOn = false; S.promoIn = ''; render(); return; }
      if ('place' in d) return place();
      if (d.openOrder) { history_.length = 0; history_.push({ view:'orders', params:{} }); return go('order', { id:d.openOrder }, false); }
      if (d.step) { const list = myOrders(); const o = list.find(x => x.id === d.step); o.step = Math.min(4, (o.step || 0) + 1); saveOrders(list); render(); return; }
      if (d.reorder) {
        const o = myOrders().find(x => x.id === d.reorder);
        S.shopId = o.shopId; S.cart = {}; o.lines.forEach(l => { S.cart[`${l.svc}|${l.item}`] = l.q; }); S.tab = o.lines[0].svc;
        history_.length = 0; return go('shop', {}, false);
      }
      if ('login' in d) return startLogin();
      if ('logout' in d) { store.del(K.session); S.phone = null; S.addrId = null; toast(t('loggedOut'), 'i-logout'); render(); return; }
      if ('copyphone' in d) {
        const done = () => toast(t('copied'), 'i-copy');
        try { navigator.clipboard.writeText(WA_DISPLAY.replace(/\s/g, '')).then(done, () => selectPhone()); } catch { selectPhone(); }
        return;
      }

      /* login sheet */
      if ('sendcode' in d) {
        let raw = ($('#phoneIn').value || '').replace(/[^\d]/g, '');
        raw = raw.replace(/^(00966|966)/, '').replace(/^0/, '');
        const ok = /^5\d{8}$/.test(raw);
        L.phone = ok ? '0' + raw : $('#phoneIn').value; L.err = !ok;
        if (ok) { L.code = String(Math.floor(1000 + Math.random() * 9000)); L.step = 'code'; }
        return loginSheet();
      }
      if ('editphone' in d) { L.step = 'phone'; L.err = false; return loginSheet(); }
      if ('verify' in d) {
        const code = [0,1,2,3].map(i => $('#otp' + i).value).join('');
        if (code !== L.code) { L.err = true; return loginSheet(); }
        S.phone = L.phone; L.err = false;
        if (me()) return finishLogin();
        L.step = 'name'; return loginSheet();
      }
      if ('savename' in d) {
        const name = $('#nameIn').value.trim();
        if (!name) { L.err = true; return loginSheet(); }
        saveMe({ name, addresses: [] }); return finishLogin();
      }
    });

    function selectPhone() {
      const el = $('.phone-line b'); if (!el) return;
      const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }

    document.addEventListener('change', e => {
      if (e.target.name === 'pay') S.pay = e.target.value;
      if (e.target.name === 'addr') S.addrId = e.target.value;
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.id && el.id.startsWith('addrText') && S.errs.addr && el.value.trim()) {
        S.errs.addr = false; el.classList.remove('bad'); el.closest('.field').nextElementSibling?.classList.contains('err') && el.closest('.field').nextElementSibling.remove();
      }
      if (el.id === 'q') {
        S.q = el.value;
        const pos = el.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos);
      }
      if (el.id && el.id.startsWith('otp')) {
        el.value = el.value.replace(/\D/g, '').slice(-1);
        const i = Number(el.id.slice(3));
        if (el.value && i < 3) $('#otp' + (i + 1)).focus();
        if (i === 3 && el.value) $('[data-verify]')?.click();
      }
    });
    document.addEventListener('paste', e => {
      if (!e.target.id?.startsWith('otp')) return;
      const digits = (e.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (digits.length === 4) { e.preventDefault(); digits.split('').forEach((c, i) => { $('#otp' + i).value = c; }); $('[data-verify]')?.click(); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
      if (e.key === 'Backspace' && e.target.id?.startsWith('otp') && !e.target.value) { const i = Number(e.target.id.slice(3)); if (i) $('#otp' + (i - 1)).focus(); }
      if (e.key === 'Enter') {
        const map = { phoneIn:'[data-sendcode]', nameIn:'[data-savename]', promo:'[data-promo]' };
        if (map[e.target.id]) { e.preventDefault(); $(map[e.target.id])?.click(); }
      }
    });
    $('#scrim').addEventListener('click', closeSheet);

    /* item names live in the dictionaries */
    Object.assign(T.ar, { item_thobe:'ثوب', item_shemagh:'شماغ / غترة', item_shirt:'قميص', item_tshirt:'تيشيرت', item_pants:'بنطلون', item_abaya:'عباية', item_suit:'بدلة', item_blanket:'بطانية', item_duvet:'لحاف', item_carpet:'سجادة', item_curtain:'ستارة' });
    Object.assign(T.en, { item_thobe:'Thobe', item_shemagh:'Shemagh / Ghutra', item_shirt:'Shirt', item_tshirt:'T-shirt', item_pants:'Trousers', item_abaya:'Abaya', item_suit:'Suit', item_blanket:'Blanket', item_duvet:'Duvet', item_carpet:'Rug', item_curtain:'Curtain' });

    if (S.phone && !me()) { S.phone = null; store.del(K.session); }
    render();
  })();
  </script>
</body>
</html>
